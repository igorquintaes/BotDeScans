name: Escola de Scans Build

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      
    steps:    
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore Dependencies
      run: dotnet restore BotDeScans.sln

    - name: Build
      run: dotnet build BotDeScans.sln --configuration Release --no-restore
        
    - name: Execute tests and generate coverage
      id: test
      run: pwsh -NoLogo -NoProfile -File ./reportgenerator.ps1 -NoBuild

    - name: Code Coverage Report
      id: report
      if: (success() || steps.test.conclusion == 'failure') && hashFiles('TestResults/Report/Cobertura.xml') != ''
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: TestResults/Report/Cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '90 95'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && github.repository_owner == 'igorquintaes' && (success() || steps.test.conclusion == 'failure' || steps.report.conclusion == 'failure')
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      if: (success() || steps.test.conclusion == 'failure') && hashFiles('coverage/**/coverage.cobertura.xml', 'TestResults/Report/Cobertura.xml') != ''
      with:
        name: code-coverage-report
        path: |
          coverage/**/coverage.cobertura.xml
          TestResults/Report/Cobertura.xml
          code-coverage-results.md
        retention-days: 5
        
    - name: dotnet publish
      if: github.repository_owner == 'igorquintaes' && github.ref == 'refs/heads/main'
      run: dotnet publish BotDeScans.App/BotDeScans.App.csproj  -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -p:PublishReadyToRunShowWarnings=true -o ${{env.DOTNET_ROOT}}/BotDeScans

    - name: Upload artifact for deployment job
      if: github.repository_owner == 'igorquintaes' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: BotDeScans
        path: ${{env.DOTNET_ROOT}}/BotDeScans